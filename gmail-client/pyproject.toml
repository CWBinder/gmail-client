[project]
name = "gmail-cli"
version = "0.1.0"
description = "Command-line Gmail client: search, read, draft, send, attachments, across several accounts, using the OAuth credentials of the MCP server next to it."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
gmail = "gmail_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gmail_cli"]
